<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Print Name</title>
    <style>
        body { font-family: sans-serif; display: flex; justify-content: center; padding-top: 50px; background: #f4f4f9; }
        .card { background: white; padding: 2rem; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        input { padding: 10px; border: 1px solid #ddd; border-radius: 4px; margin-right: 10px; }
        button { padding: 10px 20px; background: #007bff; color: white; border: none; border-radius: 4px; cursor: pointer; }
        button:hover { background: #0056b3; }
        #result { margin-top: 20px; font-weight: bold; color: #333; }
    </style>
</head>
<body>

<div class="card">
    <h2>Enter Your Name</h2>
    <input type="text" id="nameInput" placeholder="Type your name...">
    <button onclick="sendName()">Submit</button>
    <div id="result"></div>
</div>

<script>
    async function sendName() {
        const nameValue = document.getElementById('nameInput').value;
        const resultDiv = document.getElementById('result');

        try {
            const response = await fetch('http://127.0.0.1:8000/name', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                },
                body: JSON.stringify({ name: nameValue })
            });

            const data = await response.json();
            resultDiv.innerText = data;
        } catch (error) {
            resultDiv.innerText = "Error connecting to server.";
            console.error('Error:', error);
        }
    }
</script>

</body>
</html>
